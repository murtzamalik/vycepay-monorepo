spring:
  application:
    name: vycepay-auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/vycepay?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:vycepay}
    password: ${DB_PASSWORD:vycepay}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8082}

vycepay:
  jwt:
    secret: ${JWT_SECRET:vycepay-default-secret-key-min-256-bits-for-hs256}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:10}
  otp:
    length: ${OTP_LENGTH:6}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    # Set only in local/dev (e.g. 123456). Leave empty in staging/prod for random OTPs.
    dev-fixed-code: ${OTP_DEV_FIXED_CODE:123456}
  auth:
    pin:
      max-attempts: ${AUTH_PIN_MAX_ATTEMPTS:5}
      lockout-minutes: ${AUTH_PIN_LOCKOUT_MINUTES:15}
    rate-limit:
      policies:
        login:
          enabled: true
          limit: 20
          window-seconds: 60
        otp_send:
          enabled: true
          limit: 5
          window-seconds: 60
        otp_verify:
          enabled: true
          limit: 10
          window-seconds: 60
        forgot_pin:
          enabled: true
          limit: 5
          window-seconds: 300
        contacts_verify:
          enabled: true
          limit: 30
          window-seconds: 60
